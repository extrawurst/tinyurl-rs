[package]
name = "tinyurl-rs"
version = "0.2.0"
description = "Crate to simplify using tinyurl.com to shorten long urls in async rust."
edition = "2021"
license-file = "LICENSE"
repository = "https://github.com/extrawurst/tinyurl-rs"
homepage = "https://github.com/extrawurst/tinyurl-rs"
documentation = "https://docs.rs/tinyurl_rs"

[dependencies]
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1", features = ["full"] }
url = "2.5"
